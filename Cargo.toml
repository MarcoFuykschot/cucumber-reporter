[package]
name = "cucumber-reporter"
version = "0.3.0"
edition = "2024"
exclude = [
    "target/*",
]
license = "MIT"
readme = "README.md"
authors = [ "Titanium IT <marcof@titaniumit.nl>"]
description = "html reporter for cucumber-rs"
repository = "https://github.com/MarcoFuykschot/cucumber-reporter.git"
categories = ["development-tools::testing"]
keywords = ["cucumber", "testing", "bdd", "reporting","html" ]

[dependencies]
clap = "4.5.54"
cucumber = { version = "0.23.0", features = ["tracing","output-json"] }
filenamify = "0.1.2"
handlebars = { version = "6.3.1", features = ["rust-embed","dir_source"] }
gherkin = { version = "0.16.0", features = ["parser", "serde"] }
glob = "0.3.4"
rust-embed = { version = "8.6.0", features = ["tokio"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.44.1", features = ["full"] }
tracing = "0.1.38"
tracing-subscriber = { version = "0.3.22", features = ["fmt"] }
typst = "0.15.1"
typst-pdf = "0.15.1"
time = "0.3.55"
chrono = "0.4.45"
y = "0.1.0"
typst-layout = "0.15.1"
typst-kit = { version = "0.15.1", features = ["embedded-fonts"] }
typst-html = "0.15.1"

[[test]]
name="main"
harness=false

[build-dependencies]
minify-html = "0.18.1"
regex = "1.11.1"
schemars = "0.8.22"
serde_json = "1.0.151"
typify = "0.7.0"
