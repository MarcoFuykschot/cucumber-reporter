[package]
name = "cucumber-reporter"
version = "0.5.4"
edition = "2024"
exclude = [
    "target/*",
]
license = "MIT"
readme = "README.md"
authors = [ "Titanium IT <marcof@titaniumit.nl>"]
description = "Typst basedreport generator for cucumber-rs"
repository = "https://github.com/MarcoFuykschot/cucumber-reporter.git"
categories = ["development-tools::testing"]
keywords = ["cucumber", "testing", "bdd", "reporting"]

[dependencies]
cucumber = { version = "0.23.0", features = ["tracing","output-json"] }
clap = { version = "4.5.54", features = ["derive"] }
gherkin = { version = "0.16.0", features = ["parser", "serde"] }
glob = "0.3.4"
rust-embed = "8.6.0"
serde = { version = "1.0.219", features = ["derive"] }
tokio = { version = "1.44.1", features = ["full"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
tracing = "0.1.38"
tracing-subscriber = { version = "0.3.22", features = ["fmt"] }
typst = "0.15.1"
typst-pdf = "0.15.1"
time = "0.3.55"
chrono = { version = "0.4.45", features = ["serde"] }
flate2 = "1.0.35"
tar = "0.4.43"
y = "0.1.0"
typst-kit = { version = "0.15.1", features = ["embedded-fonts", "system-files", "system-downloader", "vendor-openssl"] }
typst-html = "0.15.1"
anyhow = "1.0.104"

[build-dependencies]
regex = "1.11.1"
schemars = "0.8.22"
serde_json = "1.0.151"
typify = "0.7.0"

[patch.crates-io]
gherkin = { git = "https://github.com/MarcoFuykschot/gherkin/" , branch = "fix-description-doesnt-remove-inner-newlines-and-tabs" }

[[test]]
name="main"
harness=false
